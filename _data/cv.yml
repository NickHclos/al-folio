cv:
  name: Jiachen Hu
  label: Algorithm Developer
  email: nickh@pku.edu.cn
  location: Beijing, China
  summary: >
    I am an algorithm developer at ByteDance. I received my PhD from Peking University in 2025,
    advised by Professor Liwei Wang, and remotely collaborated with Chi Jin (Princeton) and
    Lihong Li for several years. My research focuses on sample-efficient reinforcement learning
    and online learning, including statistically efficient bandits, online exploration in
    structured MDPs/POMDPs, and sim-to-real transfer.

